name: Bug report / 问题反馈
description: Report a reproducible toolkit problem using synthetic or shareable data.
body:
  - type: textarea
    attributes:
      label: Expected and actual behavior / 预期与实际
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction / 复现
      description: Commands and a minimal example; omit private videos, personal paths and secrets.
    validations:
      required: true
  - type: input
    attributes:
      label: OS, Python, FFmpeg versions / 环境版本
    validations:
      required: true
