name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify required media tools
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Check skill
        run: python tools/validate_skill.py
      - name: Check public bundle
        run: python tools/check_public_bundle.py
      - name: Test
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
      - name: Package standalone skill
        run: python tools/package_skill.py
