<!doctype html>
<html lang="@@LANG@@"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>@@TITLE@@</title><style>@@CSS@@</style></head>
<body><main>
<header><h1>@@TITLE@@</h1><p class="lede" id="intro">@@INTRO@@</p><div class="toplinks"><a href="#report" data-i18n="readReport"></a><a href="@@MARKDOWN@@" data-i18n="markdown"></a><a href="#original" data-i18n="original"></a><button id="print" data-i18n="print"></button></div></header>
<section class="card" id="viewer"><h2 data-i18n="seeEvidence"></h2><p class="muted" data-i18n="comparisonNote"></p><p class="muted evidence-meta"><span id="scope"></span> · <span id="continuity"></span></p><div class="panels">
<div class="panel"><label for="leftSelect" data-i18n="left"></label><select id="leftSelect"></select><figure><div class="imagebox"><img id="leftImg" alt="Left original video frame"></div><figcaption id="leftStamp"></figcaption></figure><p id="leftNote" class="note"></p><div class="links"><a id="leftFull" target="_blank" rel="noopener" data-i18n="enlarge"></a><a id="leftSheet" target="_blank" rel="noopener" data-i18n="sheet"></a><button id="leftVideo" data-i18n="seek"></button></div></div>
<div class="panel"><label for="rightSelect" data-i18n="right"></label><select id="rightSelect"></select><figure><div class="imagebox"><img id="rightImg" alt="Right original video frame"></div><figcaption id="rightStamp"></figcaption></figure><p id="rightNote" class="note"></p><div class="links"><a id="rightFull" target="_blank" rel="noopener" data-i18n="enlarge"></a><a id="rightSheet" target="_blank" rel="noopener" data-i18n="sheet"></a><button id="rightVideo" data-i18n="seek"></button></div></div></div>
<div class="tools"><button id="prev" data-i18n="prev"></button><button id="play" class="primary" data-i18n="play"></button><button id="next" data-i18n="next"></button><button data-offset="-0.65" data-i18n="prepare"></button><button data-offset="0" data-i18n="contact"></button><button data-offset="0.25" data-i18n="follow"></button><button data-offset="0.85" data-i18n="recover"></button><button id="swap" data-i18n="swap"></button></div>
<label class="sr" for="timeline" data-i18n="timeline"></label><input id="timeline" type="range" min="0" value="0" step="1"><div id="status" class="status" aria-live="polite"></div><p class="muted" data-i18n="keys"></p><p class="warning" id="imageError" hidden data-i18n="imageError"></p></section>
@@SUPPLEMENT@@
<section class="card" id="original"><h2 data-i18n="original"></h2><p class="muted" data-i18n="audioNote"></p><video id="video" controls preload="none" data-source="@@VIDEO@@"></video><a id="originalLink" data-i18n="openVideo"></a><p id="videoError" hidden class="warning" data-i18n="videoError"></p></section>
<details class="card" id="report"><summary data-i18n="readReport"></summary><nav class="report-toc" aria-label="Report contents">@@TOC@@</nav><article class="prose">@@REPORT@@</article></details>
<footer>Tennis Video Analysis · <span data-i18n="footer"></span></footer></main>
<script id="evidence-data" type="application/json">@@DATA@@</script><script>@@JS@@</script></body></html>
